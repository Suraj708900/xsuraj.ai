name: Validate 60 business photos and prices
on:
  push:
    branches: [main, all-business-60-photos-pricing-20261013]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check templates/templates.js
      - name: Smoke-test gallery filters and all 60 demo pages
        run: node scripts/smoke-template-ui.mjs
      - name: Check template mapping and prices
        run: node scripts/validate-templates.mjs
      - name: Check photo URLs return no 404
        env:
          CHECK_REMOTE: '1'
        run: node scripts/validate-templates.mjs
